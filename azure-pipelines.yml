trigger:
- main

pool:
  name: java-e2e-pool

variables:
  backendDir: 'backend'
  frontendDir: 'frontend'
  electronDir: 'electron'

stages:

# ============================================================
# 1. BUILD & TEST
# ============================================================
- stage: Build_Test
  displayName: 'Build and Test'

  jobs:
  - job: Build
    displayName: 'Build Naukri Application'

    steps:

    - checkout: self
      displayName: 'Checkout Source Code'


    # ---------------- BACKEND ----------------

    - task: Maven@4
      displayName: 'Backend - Maven Clean Verify'
      inputs:
        mavenPomFile: 'backend/pom.xml'
        goals: 'clean verify'
        publishJUnitResults: true
        testResultsFiles: '**/surefire-reports/TEST-*.xml'


    - task: Maven@4
      displayName: 'Backend - Maven Test'
      inputs:
        mavenPomFile: 'backend/pom.xml'
        goals: 'test'
        publishJUnitResults: true
        testResultsFiles: '**/surefire-reports/TEST-*.xml'


    - powershell: |
        Write-Host "Checking backend JAR..."

        $jar = Get-ChildItem "backend\target\*.jar" |
               Where-Object { $_.Name -notlike "*original*" } |
               Select-Object -First 1

        if (-not $jar) {
            Write-Error "Backend JAR not found"
            exit 1
        }

        Write-Host "Backend JAR found:"
        Write-Host $jar.FullName
      displayName: 'Verify Backend JAR'


    # ---------------- FRONTEND ----------------

    - powershell: |
        cd frontend

        Write-Host "Node version:"
        node --version

        Write-Host "NPM version:"
        npm --version

        npm install
        npm run build
      displayName: 'Frontend - NPM Build'


    - powershell: |
        if (-not (Test-Path "frontend\dist")) {
            Write-Error "Frontend dist directory not found"
            exit 1
        }

        Write-Host "Frontend build successful."
        Get-ChildItem "frontend\dist" -Recurse
      displayName: 'Verify Frontend Build'


# ============================================================
# 2. ELECTRON PACKAGE
# ============================================================
- stage: Electron_Package
  displayName: 'Electron Package'

  dependsOn: Build_Test

  jobs:
  - job: Electron
    displayName: 'Build Electron EXE'

    steps:

    - checkout: self


    - powershell: |
        cd electron

        npm install

        npm run dist
      displayName: 'Build Electron Application'


    - powershell: |
        Write-Host "Searching for Electron EXE..."

        $exe = Get-ChildItem -Path . -Recurse -Filter "*.exe" |
               Select-Object -First 1

        if (-not $exe) {
            Write-Error "Electron EXE not found"
            exit 1
        }

        Write-Host "EXE generated:"
        Write-Host $exe.FullName
      displayName: 'Verify EXE'


    # Publish EXE as Azure DevOps artifact

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Electron EXE'
      inputs:
        targetPath: 'electron\dist'
        artifact: 'electron-exe'


# ============================================================
# 3. PUBLISH BACKEND ARTIFACT
# ============================================================
- stage: Publish_Artifacts
  displayName: 'Publish Build Artifacts'

  dependsOn:
  - Build_Test
  - Electron_Package

  jobs:
  - job: Publish
    displayName: 'Publish Artifacts'

    steps:

    - checkout: self


    - task: PublishPipelineArtifact@1
      displayName: 'Publish Backend JAR'
      inputs:
        targetPath: 'backend\target'
        artifact: 'backend-jar'


    - task: PublishPipelineArtifact@1
      displayName: 'Publish Frontend'
      inputs:
        targetPath: 'frontend\dist'
        artifact: 'frontend-dist'


# ============================================================
# 4. DEPLOY BACKEND
# ============================================================
- stage: Deploy_Backend
  displayName: 'Deploy Backend'

  dependsOn:
  - Publish_Artifacts

  jobs:
  - job: Deploy
    displayName: 'Deploy to Naukri VM'

    steps:

    - checkout: self

    - powershell: |
        Write-Host "Preparing backend deployment..."

        if (-not (Test-Path "backend\target")) {
            Write-Error "Backend target directory not found"
            exit 1
        }

        Get-ChildItem "backend\target"
      displayName: 'Verify Deployment Artifact'


# ============================================================
# 5. HEALTH CHECK
# ============================================================
- stage: Health_Check
  displayName: 'Backend Health Check'

  dependsOn:
  - Deploy_Backend

  jobs:
  - job: Health
    displayName: 'Verify Backend'

    steps:

    - powershell: |
        Write-Host "Checking backend on port 8086..."

        $result = Test-NetConnection 127.0.0.1 -Port 8086

        if (-not $result.TcpTestSucceeded) {
            Write-Error "Backend is not listening on port 8086"
            exit 1
        }

        Write-Host "Backend port 8086 is reachable."

        $response = Invoke-WebRequest `
          -Uri "http://localhost:8086/api/health" `
          -UseBasicParsing

        Write-Host "HTTP Status: $($response.StatusCode)"
        Write-Host "Response:"
        Write-Host $response.Content

        if ($response.StatusCode -ne 200) {
            Write-Error "Backend health check failed"
            exit 1
        }

        Write-Host "Naukri backend health check successful."
      displayName: 'Backend Health Check'